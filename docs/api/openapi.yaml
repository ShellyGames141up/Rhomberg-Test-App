        lineNumber: { type: integer, minimum: 1 }
        productId: { type: string }
        productConfigurationId: { type: [string, 'null'], format: uuid }
        productCodeSnapshot: { type: string, maxLength: 80 }
        productNameSnapshot: { type: string, maxLength: 240 }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
