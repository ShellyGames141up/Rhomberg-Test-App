        '200': { description: QA state, immutable inspection history, notifications and audit updated }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /quality/orders/{orderId}/rework:
    post:
      operationId: updateQualityRework
      summary: Track correction or resubmit an order for QA reinspection
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedVersion]
              properties:
                action: { type: string, enum: [start_rework, update_rework, resubmit_to_qa] }
                expectedVersion: { type: integer, minimum: 1 }
                correctionStage: { type: string, maxLength: 160 }
                estimatedCorrectionDate: { type: string, format: date }
                customerMessage: { type: string, maxLength: 1000 }
                internalNote: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Rework cycle updated without overwriting prior QA attempts }
        '409': { $ref: '#/components/responses/ApiError' }
  /dispatch/orders/{orderId}/receive:
    post:
      operationId: confirmDispatchReceipt
      summary: Separately confirm physical receipt of any order entering Dispatch
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchReceiptRequest' }
            example:
              sourceDepartment: quality_assurance
              numberOfPackages: 2
              customerMessage: Your order has been received by Dispatch and is being prepared for handover.
              internalNote: Fabricated sealed-carton receipt note.
              expectedVersion: 12
      responses:
        '200': { description: Receipt and all authorised timelines recorded atomically }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /auth/credential-changes/challenge:
    post:
      operationId: requestCredentialChangeChallenge
      summary: Issue a short-lived, one-time verification challenge
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialChallengeRequest' }
            example: { realm: internal, changeType: password }
      responses:
        '201': { description: Verification delivery queued, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialChallenge' } } } }
        '429': { $ref: '#/components/responses/ApiError' }
  /auth/credential-changes/confirm:
    post:
      operationId: confirmCredentialChange
      summary: Consume a valid code and apply the credential change
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialChangeConfirmation' }
            example:
              requestId: 00000000-0000-4000-8000-000000000701
              verificationCode: '123456'
              newPassword: Example-Only-Strong-Password-47!
      responses:
        '200': { description: Credential changed, challenge invalidated and sessions revoked }
        '401': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /analytics/operations:
    get:
      operationId: getOperationalAnalytics
      summary: Return permission-filtered, pricing-safe operational analytics
      parameters:
        - { name: period, in: query, schema: { type: string, pattern: '^\d{4}(-\d{2})?$' } }
        - { name: branchId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operational metrics authorised for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalAnalytics' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{companyId}/representative-assignment:
    put:
      operationId: assignDedicatedRepresentative
      summary: Assign or reassign a company's dedicated representative
      description: Customer users cannot call this endpoint. Branch eligibility and audit creation are server enforced.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [representativeId, reason]
              properties:
                representativeId: { type: string, format: uuid }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200': { description: Dedicated assignment saved and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/overview:
    get:
      operationId: getAdministrationOverview
      summary: Return the permission-controlled Administration desktop overview
      description: Requires administer_users. Results are limited by administrator capability and authorised-company scope. Customer and internal identity realms are returned separately. Passwords, hashes, tokens and secret configuration are never returned.
      responses:
        '200':
          description: Authorised account, company, role, assignment and configuration summaries
          content:
            application/json:
              example:
                generatedAt: '2026-07-29T08:30:00Z'
                summary:
                  users: 18
                  customerCompanies: 3
                  internalAccounts: 15
                  rfqs: 7
                  orders: 12
                integrationPlaceholders:
                  - Private-cloud API and PostgreSQL
        '403': { $ref: '#/components/responses/Forbidden' }
  /administration/users/{userId}/status:
    put:
      operationId: setAdministrationAccountStatus
      summary: Activate or suspend an account
      description: Requires administer_users plus the matching customer-contact or internal-account capability, creates immutable before/after audit evidence and prevents self-suspension of the active Administrator. Suspension requires recent step-up verification.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, minLength: 8, maxLength: 1000 }
                verificationToken: { type: string, description: Short-lived server-issued step-up verification token; never a password. }
            example: { status: suspended, reason: Approved security suspension, verificationToken: stepup_redacted }
      responses:
        '200': { description: Sanitised account with updated status }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/companies/{companyId}/representative:
    put:
      operationId: setAdministrationCompanyRepresentative
      summary: Assign an approved representative to a customer company
      description: Requires manage_customer_companies. Company scope, representative existence, branch policy, reason and immutable audit creation are server enforced.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [representativeId, reason]
              properties:
                representativeId: { type: string }
                reason: { type: string, minLength: 8, maxLength: 1000 }
            example: { representativeId: C-27, reason: Approved dedicated sales assignment }
      responses:
        '200': { description: Representative assignment saved and audited }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/users/{userId}:
    patch:
      operationId: updateAdministrationUser
      summary: Update approved customer-contact or internal-staff identity fields
      description: Requires realm-specific capability. Role changes additionally require manage_roles_permissions and a recent step-up verification token. Realm and company membership cannot be changed through this operation.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values, reason]
              properties:
                values:
                  type: object
                  additionalProperties: false
                  properties:
                    displayName: { type: string, minLength: 2 }
                    username: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    area: { type: string }
                    branchId: { type: string, format: uuid }
                    role: { $ref: '#/components/schemas/Role' }
                reason: { type: string, minLength: 8, maxLength: 1000 }
                verificationToken: { type: string }
      responses:
        '200': { description: Sanitised account and immutable audit reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/users/{userId}/permissions:
    put:
      operationId: setAdministrationUserPermissions
      summary: Set explicit permissions for an internal administrator or staff account
      description: Requires manage_roles_permissions, separation-of-duties checks, a reason and recent step-up verification. Self-removal of administrative protection is blocked.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions, reason, verificationToken]
              properties:
                permissions: { type: array, uniqueItems: true, items: { type: string } }
                reason: { type: string, minLength: 8, maxLength: 1000 }
                verificationToken: { type: string }
      responses:
        '200': { description: Effective permissions and immutable audit reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/users/{userId}/notification-preferences:
    put:
      operationId: setAdministrationNotificationPreferences
      summary: Update notification preferences for an authorised account
      description: Requires manage_notification_preferences. Mandatory in-app security notifications remain enabled.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences, reason]
              properties:
                preferences: { type: object }
                reason: { type: string, minLength: 8, maxLength: 1000 }
      responses:
        '200': { description: Updated preferences and immutable audit reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/companies/{companyId}:
    patch:
      operationId: updateAdministrationCompany
      summary: Update approved customer-company master data and branch assignment
      description: Requires manage_customer_companies and authorised-company scope. Legal identifiers require a separately approved production workflow.
      parameters: [{ $ref: '#/components/parameters/CompanyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values, reason]
              properties:
                values: { type: object }
                reason: { type: string, minLength: 8, maxLength: 1000 }
      responses:
        '200': { description: Updated company and immutable audit reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/catalogue/{catalogueKind}/{itemId}:
    patch:
      operationId: updateAdministrationCatalogueItem
      summary: Update approved product or category information
      description: Requires manage_products. Historical RFQ/order snapshots are not rewritten.
      parameters:
        - { name: catalogueKind, in: path, required: true, schema: { type: string, enum: [categories, products] } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values, reason]
              properties:
                values: { type: object }
                reason: { type: string, minLength: 8, maxLength: 1000 }
      responses:
        '200': { description: Updated catalogue item and immutable audit reference }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ApiError' }
  /administration/workflow-records/{recordId}/corrections:
    post:
      operationId: createApprovedWorkflowRecordCorrection
      summary: Append an approved RFQ or order reference-data correction
      description: Requires correct_approved_records, expectedVersion, reason and recent step-up verification. Status, audit history, signed certificates, quotation versions and internal historical evidence are immutable.
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values, expectedVersion, reason, verificationToken]
              properties:
                values: { type: object }
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 8, maxLength: 1000 }
                verificationToken: { type: string }
      responses:
        '200': { description: Corrected projection plus immutable correction/audit references }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rhomberg_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CompanyIdQuery:
      name: companyId
      in: query
      description: Optional administrative filter; never expands the caller's authorised company scope.
      schema: { type: string, format: uuid }
    OverrideId:
      name: overrideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: unitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LabTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnquiryId:
      name: enquiryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: query
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    Status:
      name: status
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    ApiError:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The authenticated actor lacks permission or company scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You do not have access to this record.
              correlationId: corr-demo-403
  schemas:
    CalibrationUnit:
      type: object
      required: [id, orderId, orderItemId, unitSequence, productModel, calibrationType, status, certificateStatus]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        unitSequence: { type: integer, minimum: 1 }
        productModel: { type: string }
        productDescription: { type: string }
        serialNumber: { type: string, nullable: true }
        calibrationType: { type: string, enum: [sanas, traceable] }
        urgent: { type: boolean }
        status: { type: string }
        certificateStatus: { type: string }
        receivedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }
    LaboratoryOrder:
      type: object
      required: [id, reference, companyId, routing, units]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, example: OR-DEMO-2101 }
        sourceRfqReference: { type: string, example: RFQ-DEMO-2101 }
        companyId: { type: string, format: uuid }
        companyName: { type: string, example: Fabricated Cape Engineering }
        internalJobNumber: { type: string, example: JOB-DEMO-2101 }
        customerPoNumber: { type: string, example: PO-DEMO-2101 }
        trackingStatus: { type: string }
        routing:
          type: object
          properties:
            requiresLaboratory: { type: boolean }
            certificateTypes: { type: array, items: { type: string, enum: [sanas, traceable] } }
        units: { type: array, items: { $ref: '#/components/schemas/CalibrationUnit' } }
    Certificate:
      type: object
      required: [id, unitId, orderId, certificateNumber, certificateType, certificateDate, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        certificateNumber: { type: string, example: CERT-DEMO-2101 }
        certificateType: { type: string, enum: [sanas, traceable] }
        certificateDate: { type: string, format: date }
        uploadDate: { type: string, format: date-time }
        downloadAuthorised: { type: boolean }
    QualityTask:
      type: object
      required: [id, orderId, status, inspectionCount, reworkCount]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string }
        inspectionCount: { type: integer, minimum: 0 }
        reworkCount: { type: integer, minimum: 0 }
        previousFailures: { type: array, items: { type: object, additionalProperties: true } }
    QualityActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedVersion, data]
      properties:
        action: { type: string, enum: [start_qa, pass_qa, fail_qa, release_qa_order] }
        expectedVersion: { type: integer, minimum: 1 }
        data:
          type: object
          properties:
            inspectionDate: { type: string, format: date }
            checklistConfirmed: { type: boolean }
            meetsRequirements: { type: boolean }
            problemCategory: { type: string }
            problemDescription: { type: string }
            otherExplanation: { type: string }
            affectedOrderItemId: { type: string, format: uuid }
            severity: { type: string, enum: [low, medium, high, critical] }
            dateFound: { type: string, format: date }
            returnDestination: { type: string }
            customerMessage: { type: string }
            internalNote: { type: string }
    DispatchReceiptRequest:
      type: object
      additionalProperties: false
      required: [sourceDepartment, numberOfPackages, customerMessage, expectedVersion]
      properties:
        sourceDepartment: { type: string, enum: [laboratory, quality_assurance, expediting, planning, authorised_exception] }
        numberOfPackages: { type: integer, minimum: 1, maximum: 999 }
        exceptionReason: { type: string, minLength: 10, maxLength: 1000 }
        customerMessage: { type: string, minLength: 5, maxLength: 1000 }
        internalNote: { type: string, maxLength: 2000 }
        expectedVersion: { type: integer, minimum: 1 }
    CredentialChallengeRequest:
      type: object
      additionalProperties: false
      required: [realm, changeType]
      properties:
        realm: { type: string, enum: [customer, internal] }
        changeType: { type: string, enum: [username, password] }
    CredentialChallenge:
      type: object
      required: [requestId, expiresAt, attemptsRemaining, delivery]
      properties:
        requestId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        attemptsRemaining: { type: integer, minimum: 0 }
        delivery: { type: string, enum: [email_pending] }
        developmentCode:
          type: string
          description: Present only in an explicitly enabled non-production mock environment.
    CredentialChangeConfirmation:
      type: object
      additionalProperties: false
      required: [requestId, verificationCode]
      properties:
        requestId: { type: string, format: uuid }
        verificationCode: { type: string, pattern: '^\d{6}$' }
        newUsername: { type: string, minLength: 4, maxLength: 80 }
        newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    OperationalAnalytics:
      type: object
      required: [generatedAt, period, totals, stageAverages, products, representatives]
      properties:
        generatedAt: { type: string, format: date-time }
        period: { type: string }
        totals: { type: object, additionalProperties: { type: number } }
        stageAverages: { type: object, additionalProperties: { type: number } }
        products: { type: array, items: { type: object, additionalProperties: true } }
        representatives: { type: array, items: { type: object, additionalProperties: true } }
        revenue:
          type: object
          description: Placeholder only; omitted unless an explicit protected-pricing permission and approved backend source exist.
          properties:
            enabled: { type: boolean, const: false }
    Role:
      type: string
      enum: [customer, sales_representative, planning, expeditor, dispatch, buyer, manager, administrator]
    Permission:
      type: string
      enum:
        - access_customer_workspace
        - access_internal_workspace
        - read_catalogue
        - view_own_company_account
        - view_all_companies
        - create_rfq
        - view_own_company_rfqs
        - view_assigned_rfqs
        - view_all_rfqs
        - assign_rfq
        - mark_rfq_under_review
        - mark_rfq_quoted
        - acknowledge_quotation
        - accept_customer_order
        - convert_rfq_to_order
        - cancel_rfq
        - expire_rfq
        - view_own_company_orders
        - view_assigned_orders
        - view_planning_queue
        - add_planning_information
        - submit_to_expediting
        - view_expediting_queue
        - update_order_progress
        - move_to_dispatch
        - view_dispatch_queue
        - confirm_delivery
        - confirm_collection
        - manage_order_hold
        - cancel_order
        - view_all_orders
        - export_order_pdf
        - email_order_summary
        - archive_orders
        - restore_archived_orders
        - administer_users
        - override_workflow
        - read_audit_history
        - manage_products
        - view_reports
    RoleDefinition:
      type: object
      additionalProperties: false
      required: [code, name, description, active]
      properties:
        code: { $ref: '#/components/schemas/Role' }
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    PermissionDefinition:
      type: object
      additionalProperties: false
      required: [code, description]
      properties:
        code: { $ref: '#/components/schemas/Permission' }
        description: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time, readOnly: true }
    UserAdministrationRecord:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, roleCodes, companyIds, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 160 }
        phone: { type: string, maxLength: 80 }
        status: { type: string, enum: [pending, active, suspended, archived] }
        roleCodes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
        companyIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        lastSignedInAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, roleCodes, companyIds]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, maxLength: 80 }
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Role' }
        companyIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    UserRoleAssignment:
      type: object
      additionalProperties: false
      required: [userId, roleCode, assignedBy, assignedAt]
      properties:
        userId: { type: string, format: uuid }
        roleCode: { $ref: '#/components/schemas/Role' }
        assignedBy: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    CompanyUser:
      type: object
      additionalProperties: false
