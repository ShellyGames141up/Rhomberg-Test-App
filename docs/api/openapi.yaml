openapi: 3.1.0
info:
  title: Rhomberg Instruments Private-Cloud API
  version: 0.7.0-proposed
  description: |
    Proposed production contract for the completed RFQ-to-order workflow.
    No production service or database is connected. All examples are fabricated.
    The public API retains the established `/enquiries` resource name while the
    canonical PostgreSQL entity is `app.rfqs`; the backend adapter owns that mapping.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/csrf-token:
    get:
      security: []
      operationId: getCsrfToken
      responses:
        '200':
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /auth/register:
    post:
      security: []
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Customer account created or queued for verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ApiError'
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/ApiError'
  /auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Session revoked
  /auth/refresh:
    post:
      operationId: refreshSession
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Session and CSRF token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshResponse'
  /reference-data/registration:
    get:
      security: []
      operationId: getRegistrationReferenceData
      responses:
        '200':
          description: Registration, branch and representative options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationOptionsResponse'
  /companies/me:
    get:
      operationId: getCurrentCompany
      responses:
        '200':
          description: Current authorised company context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
  /companies:
    get:
      operationId: listCompanies
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Companies within the caller's administrative scope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/ApiError'
  /representatives:
    get:
      operationId: listRepresentatives
      parameters:
        - name: area
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Active representatives eligible for the selected area
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Representative'
  /products/categories:
    get:
      security: []
      operationId: listProductCategories
      responses:
        '200':
          description: Product categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCategory'
  /products/recommendations:
    get:
      security: []
      operationId: getProductRecommendations
      responses:
        '200':
          description: Industry-to-category recommendations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
  /products:
    get:
      security: []
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Products visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
  /products/{productId}:
    get:
      security: []
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Full product
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ApiError'
  /enquiry-drafts/current:
    get:
      operationId: getCurrentDraft
      responses:
        '200':
          description: Current customer's draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
    put:
      operationId: saveCurrentDraft
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnquiryItemInput'
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
  /enquiries:
    get:
      operationId: listAuthorisedEnquiries
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Server-scoped enquiries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      operationId: submitEnquiry
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded EnquirySubmission
                purchaseOrder:
                  type: string
                  format: binary
      responses:
        '201':
          description: RFQ stored and delivery queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnquirySubmissionResponse'
        '422':
          $ref: '#/components/responses/ApiError'
  /enquiries/inbox:
    get:
      operationId: listRepresentativeRfqInbox
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: group
          in: query
          schema:
            type: string
            enum: [all, new, under_review, quoted, awaiting_acceptance, accepted, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [urgent, standard]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: RFQs assigned to the representative identity in the verified session
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enquiry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/ApiError'
  /enquiries/{enquiryId}:
    get:
      operationId: getAuthorisedEnquiry
      parameters:
        - $ref: '#/components/parameters/EnquiryId'
      responses:
        '200':
          description: Authorised enquiry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Enquiry'
        '404':
          $ref: '#/components/responses/ApiError'
  /enquiries/{enquiryId}/workflow-actions:
    get:
      operationId: listEnquiryWorkflowActions
      parameters:
        - $ref: '#/components/parameters/EnquiryId'
      responses:
        '200':
          description: Actions allowed for the current actor and RFQ state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowActionsResponse'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: performEnquiryWorkflowAction
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/EnquiryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActionRequest'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded WorkflowActionRequest for mark_quoted or accept_order.
                quotationDocument:
                  type: string
                  format: binary
                  description: Optional authorised quotation evidence; PDF, DOC, DOCX or image, maximum 4 MB.
                acceptanceDocument:
                  type: string
                  format: binary
                  description: Optional internal order-acceptance evidence for accept_order; PDF, DOC, DOCX or image, maximum 4 MB.
      responses:
        '201':
          description: Controlled RFQ action completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnquiryWorkflowActionResponse'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /planning/workspace-options:
    get:
      operationId: getPlanningWorkspaceOptions
      description: Requires add_planning_information. Returns server-owned Planning users, production locations and priorities.
      responses:
        '200':
          description: Authorised Planning reference data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PlanningWorkspaceOptions'
        '403':
          $ref: '#/components/responses/ApiError'
  /expediting/workspace-options:
    get:
      operationId: getExpeditingWorkspaceOptions
      description: Requires view_expediting_queue or an authorised Expediting action permission. Returns server-owned progress steps, Dispatch requirements, controlled reference types and approaching-completion policy.
      responses:
        '200':
          description: Authorised Expediting reference data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ExpeditingWorkspaceOptions'
        '403':
          $ref: '#/components/responses/ApiError'
  /dispatch/workspace-options:
    get:
      operationId: getDispatchWorkspaceOptions
      description: Requires view_dispatch_queue, confirm_collection or confirm_delivery. Returns server-owned handover methods, controlled proof types and the upload limit.
      responses:
        '200':
          description: Authorised Dispatch reference data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DispatchWorkspaceOptions'
        '403':
          $ref: '#/components/responses/ApiError'
  /orders:
    get:
      operationId: listAuthorisedOrders
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Server-scoped orders
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
  /orders/{orderId}/tracking-events:
    get:
      operationId: listOrderTrackingEvents
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Authorised order timeline
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackingEvent'
  /orders/{orderId}/workflow-actions:
    get:
      operationId: listOrderWorkflowActions
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Actions allowed for the current actor and order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowActionsResponse'
        '404':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: performOrderWorkflowAction
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActionRequest'
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded WorkflowActionRequest.
                dispatchProof:
                  type: string
                  format: binary
                  description: Optional PDF or image for a Dispatch confirmation; maximum 4 MB under the proposed policy.
      responses:
        '201':
          description: Controlled order action completed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /orders/{orderId}:
    get:
      operationId: getAuthorisedOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Authorised order detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ApiError'
  /users/me/personalisation:
    get:
      operationId: getCustomerPersonalisation
      responses:
        '200':
          description: Complete personalisation for the signed-in customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPersonalisationResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
    put:
      operationId: saveCustomerPersonalisation
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPersonalisation' }
      responses:
        '200':
          description: Complete validated preference set saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPersonalisationResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /users/me/personalisation/reset:
    post:
      operationId: resetCustomerPersonalisation
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reopenSetup: { type: boolean, default: false }
      responses:
        '200':
          description: Approved Rhomberg defaults restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPersonalisationResponse' }
        '403':
          $ref: '#/components/responses/ApiError'
  /users/me/personalisation/images:
    post:
      operationId: uploadCustomerIdentityImage
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, image]
              properties:
                kind: { type: string, enum: [profileImage, companyLogo] }
                position: { type: string, description: JSON object containing integer x/y percentages from 0 to 100. }
                image: { type: string, format: binary }
      responses:
        '201':
          description: Scanned private image metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerIdentityImage' }
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /users/me/personalisation/images/{imageId}:
    delete:
      operationId: removeCustomerIdentityImage
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Image removed from the signed-in customer account
        '404':
          $ref: '#/components/responses/ApiError'
  /orders/{orderId}/summary-sharing-options:
    get:
      operationId: getOrderSummarySharingOptions
      description: Returns only the assigned representative and internal recipients authorised for the signed-in internal user.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Authorised recipient choices
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [canEmail, internalRecipients]
                    properties:
                      canEmail: { type: boolean }
                      representative:
                        type: object
                        nullable: true
                        properties:
                          name: { type: string }
                          email: { type: string, format: email }
                      internalRecipients:
                        type: array
                        items:
                          type: object
                          required: [id, name, role, email]
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            role: { type: string }
                            email: { type: string, format: email }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
  /orders/{orderId}/summary-pdfs:
    post:
      operationId: generateOrderSummaryPdf
      description: Generates a fresh private customer-safe or internal operational PDF and appends an immutable audit event.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [copyType]
              properties:
                copyType: { type: string, enum: [customer, internal] }
      responses:
        '201':
          description: Private document metadata with short-lived authorised URLs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, orderId, copyType, classification, fileName, mimeType, sizeBytes, generatedAt, generatedBy, previewUrl, downloadUrl]
                    properties:
                      id: { type: string, format: uuid }
                      orderId: { type: string, format: uuid }
                      copyType: { type: string, enum: [customer, internal] }
                      classification: { type: string, enum: [CUSTOMER COPY, INTERNAL - OPERATIONAL COPY] }
                      fileName: { type: string }
                      mimeType: { type: string, enum: [application/pdf] }
                      sizeBytes: { type: integer, minimum: 1 }
                      generatedAt: { type: string, format: date-time }
                      generatedBy:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          displayName: { type: string }
                          role: { type: string }
                      previewUrl: { type: string, format: uri, description: Short-lived, authorised URL. }
                      downloadUrl: { type: string, format: uri, description: Short-lived, authorised URL. }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /orders/{orderId}/summary-emails:
    post:
      operationId: emailOrderSummaryPdf
      description: Validates the recipient and queues delivery through the secure outbox. Internal copies cannot be sent externally.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, recipientType]
              properties:
                documentId: { type: string, format: uuid }
                recipientType: { type: string, enum: [manual, representative, internal] }
                recipientEmail: { type: string, format: email }
                confirmedExternal: { type: boolean, default: false }
      responses:
        '202':
          description: Email accepted by the retry-ready outbox
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, channel, status, recipientType, recipientEmail, external, documentId, createdAt]
                    properties:
                      id: { type: string, format: uuid }
                      channel: { type: string, enum: [email] }
                      status: { type: string, enum: [email_pending] }
                      recipientType: { type: string, enum: [manual, representative, internal] }
                      recipientEmail: { type: string, format: email }
                      external: { type: boolean }
                      documentId: { type: string, format: uuid }
                      createdAt: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
  /notifications:
    get:
      operationId: listAuthorisedNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notifications within the caller's authorised scope
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '404':
          $ref: '#/components/responses/ApiError'
  /notifications/read-all:
    post:
      operationId: markAllAuthorisedNotificationsRead
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: All unread notifications in the caller's authorised inbox marked as read
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [updatedCount, readAt]
                    properties:
                      updatedCount: { type: integer, minimum: 0 }
                      readAt: { type: string, format: date-time }
  /users/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Current user's notification delivery and category preferences
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      operationId: replaceNotificationPreferences
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
